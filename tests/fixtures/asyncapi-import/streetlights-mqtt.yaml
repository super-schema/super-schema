asyncapi: 3.0.0
info:
  title: Streetlights MQTT API
  version: 1.0.0
  description: The Smartylighting Streetlights API over MQTT.
  termsOfService: https://www.example.com/terms
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
defaultContentType: application/json
servers:
  production:
    host: test.mosquitto.org:{port}
    protocol: mqtt
    protocolVersion: '5'
    description: Test broker
    variables:
      port:
        description: Secure connection (TLS) is available through port 8883.
        default: '1883'
        enum:
          - '1883'
          - '8883'
    security:
      - $ref: '#/components/securitySchemes/apiKey'
      - $ref: '#/components/securitySchemes/supportedOauthFlows'
      - $ref: '#/components/securitySchemes/openIdConnectWellKnown'
    tags:
      - name: env:production
        description: This environment is meant for running production tests
    bindings:
      mqtt:
        clientId: guest
        cleanSession: true
        keepAlive: 60
        bindingVersion: 0.2.0
channels:
  lightingMeasured:
    address: smartylighting/streetlights/1/0/event/{streetlightId}/lighting/measured
    servers:
      - $ref: '#/servers/production'
    messages:
      lightMeasured:
        $ref: '#/components/messages/lightMeasured'
    description: The topic on which measured values may be produced and consumed.
    parameters:
      streetlightId:
        $ref: '#/components/parameters/streetlightId'
    bindings:
      mqtt:
        bindingVersion: 0.2.0
  lightTurnOn:
    address: smartylighting/streetlights/1/0/action/{streetlightId}/turn/on
    servers:
      - $ref: '#/servers/production'
    messages:
      turnOn:
        $ref: '#/components/messages/turnOnOff'
    parameters:
      streetlightId:
        $ref: '#/components/parameters/streetlightId'
operations:
  receiveLightMeasurement:
    action: receive
    channel:
      $ref: '#/channels/lightingMeasured'
    summary: Inform about environmental lighting conditions of a particular streetlight.
    security:
      - $ref: '#/components/securitySchemes/apiKey'
    bindings:
      mqtt:
        qos: 1
        retain: false
        bindingVersion: 0.2.0
    messages:
      - $ref: '#/channels/lightingMeasured/messages/lightMeasured'
  turnOn:
    action: send
    channel:
      $ref: '#/channels/lightTurnOn'
    messages:
      - $ref: '#/channels/lightTurnOn/messages/turnOn'
components:
  messages:
    lightMeasured:
      name: lightMeasured
      title: Light measured
      summary: Inform about environmental lighting conditions of a particular streetlight.
      contentType: application/json
      payload:
        type: object
        properties:
          lumens:
            type: integer
            minimum: 0
            description: Light intensity measured in lumens.
          sentAt:
            type: string
            format: date-time
    turnOnOff:
      name: turnOnOff
      title: Turn on/off
      summary: Command a particular streetlight to turn the lights on or off.
      payload:
        type: object
        properties:
          command:
            type: string
            enum:
              - 'on'
              - 'off'
  parameters:
    streetlightId:
      description: The ID of the streetlight.
  securitySchemes:
    apiKey:
      type: apiKey
      in: user
      description: Provide your API key as the user and leave the password empty.
    supportedOauthFlows:
      type: oauth2
      description: Flows to support OAuth 2.0
      flows:
        implicit:
          authorizationUrl: https://authserver.example/auth
          availableScopes:
            streetlights:on: Ability to switch lights on
            streetlights:off: Ability to switch lights off
            streetlights:dim: Ability to dim the lights
        password:
          tokenUrl: https://authserver.example/token
          availableScopes:
            streetlights:on: Ability to switch lights on
            streetlights:off: Ability to switch lights off
            streetlights:dim: Ability to dim the lights
        clientCredentials:
          tokenUrl: https://authserver.example/token
          availableScopes:
            streetlights:on: Ability to switch lights on
            streetlights:off: Ability to switch lights off
            streetlights:dim: Ability to dim the lights
        authorizationCode:
          authorizationUrl: https://authserver.example/auth
          tokenUrl: https://authserver.example/token
          refreshUrl: https://authserver.example/refresh
          availableScopes:
            streetlights:on: Ability to switch lights on
            streetlights:off: Ability to switch lights off
            streetlights:dim: Ability to dim the lights
      scopes:
        - streetlights:on
        - streetlights:off
        - streetlights:dim
    openIdConnectWellKnown:
      type: openIdConnect
      openIdConnectUrl: https://authserver.example/.well-known/openid-configuration
