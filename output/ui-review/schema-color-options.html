  <script>
    (() => {
      const root = document.getElementById('schema-color-options');
      const data = JSON.parse(root.querySelector('[data-samples]').textContent);
      const appearance = root.querySelector('[name="appearance"]');
      const language = root.querySelector('[name="language"]');
      function restore(state) {
        const saved = state?.modelContent;
        if (['light', 'dark'].includes(saved?.appearance)) appearance.value = saved.appearance;
        if (Object.hasOwn(data.samples, saved?.format)) language.value = saved.format;
      }
      function draw() {
        for (const scheme of root.querySelectorAll('[data-scheme]')) {
          const sample = data.rendered[scheme.dataset.scheme + '-' + appearance.value + '-' + language.value];
          const pre = scheme.querySelector('pre');
          pre.style.setProperty('--sample-bg', sample.bg);
          pre.style.setProperty('--sample-fg', sample.fg);
          const code = pre.querySelector('code');
          code.replaceChildren();
          sample.lines.forEach((line, index) => {
            if (index) code.append(document.createTextNode('\n'));
            for (const token of line) {
              const span = document.createElement('span');
              span.textContent = token.text;
              span.style.color = token.color || sample.fg;
              if (token.italic) span.style.fontStyle = 'italic';
              code.append(span);
            }
          });
          scheme.querySelector('[data-contrast]').textContent = sample.stringContrast ? 'String-to-background contrast ' + sample.stringContrast + ':1' : '';
        }
      }
      function change() {
        draw();
        window.openai?.setWidgetState?.({modelContent: {appearance: appearance.value, format: language.value}, privateContent: null})?.catch(() => {});
      }
      restore(window.openai?.widgetState);
      appearance.addEventListener('change', change);
      language.addEventListener('change', change);
      window.addEventListener('openai:set_globals', event => { restore(event.detail.globals.widgetState); draw(); });
      draw();
    })();
  </script>
